<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJ IDE Copier - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <!-- Toggle Button - Always Visible -->
        <button class="dashboard-toggle-btn" id="dashboardToggle" title="Toggle Dashboard">
            📊 Dashboard
        </button>
        
        <!-- Sidebar - Hidden by Default -->
        <aside class="sidebar" id="dashboardSidebar" style="transform: translateX(-100%);">
            <div style="padding: 16px; margin-bottom: 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="color: #2196F3; font-size: 20px;">🚀 NJ IDE Copier</h2>
                    <button class="sidebar-close-btn" id="sidebarClose">×</button>
                </div>
            </div>
            <nav>
                <a class="nav-item active" href="#dashboard">📊 Dashboard</a>
                <a class="nav-item" href="#code-blocks">💻 Code Blocks</a>
                <a class="nav-item" href="#versions">📚 Version History</a>
                <a class="nav-item" href="#errors">⚠️ Error Tracker</a>
                <a class="nav-item" href="#settings">⚙️ Settings</a>
            </nav>
            <div style="margin-top: auto; padding-top: 24px;">
                <div class="card" style="padding: 16px;">
                    <h4 style="margin-bottom: 8px;">Server Status</h4>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="width: 10px; height: 10px; background: #4CAF50; border-radius: 50%; animation: pulse 2s infinite;"></span>
                        <span style="color: #4CAF50; font-weight: 500;">Running</span>
                    </div>
                </div>
            </div>
        </aside>

        <header class="header">
            <div style="flex: 1;">
                <input type="text" placeholder="Search code, errors..." style="width: 100%; padding: 8px 16px; border: 1px solid #e0e0e0; border-radius: 9999px; font-size: 14px;">
            </div>
            <button class="btn btn-primary">📋 Copy Last Code</button>
        </header>

        <main class="main-content">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="totalBlocks">0</div><div class="stat-label">Code Blocks</div></div>
                <div class="stat-card"><div class="stat-value" id="totalVersions">0</div><div class="stat-label">Versions</div></div>
                <div class="stat-card"><div class="stat-value" id="errorFixes">0</div><div class="stat-label">Errors Fixed</div></div>
                <div class="stat-card"><div class="stat-value" id="activeBlocks">0</div><div class="stat-label">Active Blocks</div></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Recent Code Blocks</h3>
                    <button class="btn btn-secondary" style="font-size: 12px;">View All</button>
                </div>
                <div id="blockList"><p>Loading...</p></div>
            </div>

            <div class="card">
                <div class="card-header"><h3>Error Analytics</h3></div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; text-align: center;">
                    <div><div class="badge badge-error" style="margin-bottom: 8px;">TypeError</div><div style="font-size: 20px; font-weight: 600;">0</div><small style="color: #757575;">occurrences</small></div>
                    <div><div class="badge badge-warning" style="margin-bottom: 8px;">SyntaxError</div><div style="font-size: 20px; font-weight: 600;">0</div><small style="color: #757575;">occurrences</small></div>
                    <div><div class="badge badge-info" style="margin-bottom: 8px;">ImportError</div><div style="font-size: 20px; font-weight: 600;">0</div><small style="color: #757575;">occurrences</small></div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Styles for toggle -->
    <style>
        .dashboard-toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999999;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        
        .dashboard-toggle-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        
        .sidebar-close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 20px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .sidebar-close-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            background: #1a1a2e;
            transition: transform 0.3s ease;
            z-index: 1000000;
            overflow-y: auto;
        }
        
        .sidebar.open {
            transform: translateX(0) !important;
        }
        
        body.sidebar-open .dashboard {
            margin-left: 250px;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }
        }
    </style>
    
    <script>
        // Toggle dashboard sidebar
        const toggleBtn = document.getElementById('dashboardToggle');
        const sidebar = document.getElementById('dashboardSidebar');
        const closeBtn = document.getElementById('sidebarClose');
        
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
            document.body.classList.add('sidebar-open');
        });
        
        closeBtn.addEventListener('click', () => {
            sidebar.classList.remove('open');
            document.body.classList.remove('sidebar-open');
        });
        
        // Close when clicking outside
        document.addEventListener('click', (e) => {
            if (sidebar.classList.contains('open') && 
                !sidebar.contains(e.target) && 
                e.target !== toggleBtn) {
                sidebar.classList.remove('open');
                document.body.classList.remove('sidebar-open');
            }
        });
        
        // Handle navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const hash = item.getAttribute('href');
                window.location.hash = hash.substring(1);
                
                // Update active state
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                // Close sidebar on mobile
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove('open');
                    document.body.classList.remove('sidebar-open');
                }
            });
        });
    </script>
    
    <script src="dashboard.js"></script>
</body>
</html>
